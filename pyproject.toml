[project]
name = "omicz-invenio"
version = "1.0.0"
description = "OmiCZ omics data repository — Invenio + CCMM with OmiCZ metadata extension."
packages = []
authors = []
dependencies = [
    "oarepo[s3,rdm]>=14.0.0,<15.0.0",
    "oarepo-app[ccmm,production]>=7.0.0rc1,<8.0.0",
    "oarepo-oidc-einfra",
]
requires-python = ">=3.14,<3.15"

[project.entry-points."invenio_assets.webpack"]
i18n = "i18n.webpack:theme"
components = "ui.components.webpack:theme"
ui_omics = "ui.omics.webpack:theme"

[project.entry-points."invenio_i18n.translations"]
translations = "i18n"

[project.entry-points."invenio_db.alembic"]
repository = "common:alembic"

[project.entry-points."invenio_base.blueprints"]
ui_omics = "ui.omics:create_blueprint"

[project.entry-points."invenio_base.finalize_app"]
ui_omics = "ui.omics:finalize_app"

[tool.uv.build-backend]
module-root = ""
module-name = [
    "common",
    "i18n",
    "ui",
    "models",
]

[build-system]
requires = [
    "uv_build>=0.8.7,<0.9.0",
]
build-backend = "uv_build"
